    userID
    mfa {
      webAuthnKeys {
        keyName
        credentialID
        lastSuccessfulChallenge
        transports
      }
      totpData
      backupCodes
    }
  }
}

query getRecoveryData($request: GetUserRequest!) {
  user(request: $request) {
    userID
    encryptedRecoveryData
  }
}

query getUserTags($request: GetUserRequest!) {
  user(request: $request) {
    accountTags
    userID
  }
}

query getSubscriptionInfo {
  currentUser {
    userID
    subscriptionInfo {
      subscriptionPlan
      isCryptoSubscription
      isAppleSubscription
      isGoogleSubscription
      cancelAtPeriodEnd
      supposedEndDate
      stripeStatus
      billingInterval
      quantity
    }
  }
}

query getInvoiceHistory {
  currentUser {
    userID
    invoiceHistory {
      invoiceHistory {
        amountDue
        created
        url
        invoiceTiers
        status
      }
    }
  }
}

