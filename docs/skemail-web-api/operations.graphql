fragment Address on AddressObject {
  name
  address
  blocked
}

fragment Attachment on Attachment {
  attachmentID
  downloadLink
  encryptedSessionKey {
    encryptedSessionKey
    encryptedBy
  }
}

fragment DNSRecordData on DNSRecord {
  name
  type
  data
  error {
    errorData {
      retrievedRecord {
        priority
        data
      }
    }
    errorType
  }
}

fragment DocumentBase on Document {
  ...DocumentBasicInfo
  ...DocumentDecryptedMetadata
  ...DocumentParentsBreadcrumb
  updatedAt
}

fragment DocumentBasicInfo on Document {
  ...DocumentBasicInfoWithoutTeamOrOrg
  team {
    teamID
    name
    icon
    accessLevel
    rootDocument {
      docID
    }
    organization {
      orgID
    }
  }
  cloneDocID
}

fragment DocumentBasicInfoWithoutTeamOrOrg on Document {
  docID
  documentType
  publicHierarchicalKey
  currentUserPermissionLevel
  hierarchicalPermissionChain {
    ...DocumentHierarchicalPermissionChainInfo
  }
  parentID
  hasChildren
  trashedAt
  previousParentID
}

fragment DocumentCollaboratorInfo on DocumentCollaborator {
  user {
    ...UserProfileData
  }
  permissionLevel
  expiryDate
  sourceDocID
}

fragment DocumentCollaborators on Document {
  collaborators {
    ...DocumentCollaboratorInfo
  }
}

fragment DocumentContents on Document {
  updatedAt
  contents {
    contentsArr {
      content
      signedBy
      signature
      chunkNumber
    }
  }
}

fragment DocumentCurrentlyEditingUsers on Document {
  docID
}

fragment DocumentDecryptedMetadata on Document {
  createdAt
  metadata {
    signedBy
    encryptedMetadata
    signature
  }
}

fragment DocumentFullInfo on Document {
  ...DocumentBasicInfo
  ...DocumentDecryptedMetadata
  ...DocumentContents
  ...DocumentCurrentlyEditingUsers
  ...DocumentLink
  ...DocumentInvites
  ...DocumentTeam
  ...DocumentParentsBreadcrumb
  ...DocumentCollaborators
  parentKeysClaim
  parentPublicHierarchicalKey
  thumbnail
}

fragment DocumentHierarchicalPermissionChainInfo on HierarchicalPermissionChainLink {
  docID
  previousLinkDocID
  keysClaim
  keysClaimEncryptedByKey
  permission {
    ...DocumentPermissionInfo
  }
  encryptedSessionKey
  encryptedSessionKeyEncryptedByKey
}

fragment DocumentInvites on Document {
  invites {
    docID
    email
    permissionLevel
  }
}

fragment DocumentLink on Document {
  link {
    encryptedLinkKey
    permissionLevel
    salt
  }
}

fragment DocumentParentsBreadcrumb on Document {
  parentsBreadcrumb {
    docID
  }
}

fragment DocumentPermissionInfo on PermissionEntry {
  userID
  expiryDate
  encryptedBy
  encryptedKey
  encryptedPrivateHierarchicalKey
}

fragment DocumentPermissionProxies on Document {
  permissionProxies {
    sourceDocID
    sourceTeam {
      teamID
      name
      icon
    }
  }
}

fragment DocumentTeam on Document {
  team {
    teamID
    name
    icon
    accessLevel
    rootDocument {
      docID
    }
    organization {
      orgID
    }
  }
}

fragment Email on Email {
  id
  attachmentMetadata {
    attachmentID
  }
  createdAt
  from {
    ...Address
  }
  to {
    ...Address
  }
  cc {
    ...Address
  }
  bcc {
    ...Address
  }
  replyTo {
    ...Address
  }
  encryptedSessionKey {
    encryptedSessionKey
    encryptedBy
  }
  encryptedSubject {
    encryptedData
  }
  encryptedText {
    encryptedData
  }
  encryptedHtml {
    encryptedData
  }
  encryptedTextAsHtml {
    encryptedData
  }
  encryptedTextSnippet {
    encryptedData
  }
  attachmentMetadata {
    attachmentID
    encryptedData {
      encryptedData
    }
  }
  scheduleSendAt
  encryptedRawMimeUrl
  notificationsTurnedOffForSender
}

fragment EmailWithoutContent on Email {
  id
  attachmentMetadata {
    attachmentID
  }
  createdAt
  from {
    ...Address
  }
  to {
    ...Address
  }
  cc {
    ...Address
  }
  bcc {
    ...Address
  }
  replyTo {
    ...Address
  }
  encryptedSessionKey {
    encryptedSessionKey
    encryptedBy
  }
  encryptedSubject {
    encryptedData
  }
  encryptedTextSnippet {
    encryptedData
  }
  attachmentMetadata {
    attachmentID
    encryptedData {
      encryptedData
    }
  }
  scheduleSendAt
  encryptedRawMimeUrl
  notificationsTurnedOffForSender
}

fragment ExternalEmailClientLabel on ExternalEmailClientLabel {
  labelID
  labelName
  ... on ExternalEmailClientSystemLabel {
    skiffSystemLabel
  }
  ... on ExternalEmailClientUserLabel {
    skiffUserLabel {
      labelID
      labelName
      color
      variant
    }
  }
}

fragment LoginSrpResponseData on LoginSrpResponse {
  userID
  status
  serverSessionProof
  publicKey
  signingPublicKey
  encryptedUserData
  encryptedDocumentData
  jwt
  cacheKey
  encryptedMetamaskSecret
  publicData {
    displayName
  }
  recoveryEmail
  unverifiedRecoveryEmail
  walletAddress
  rootOrgID
  webAuthnChallengeResponse {
    options
  }
  mfaTypes
}

fragment OrganizationFullInfo on Organization {
  orgID
  name
  teams {
    accessLevel
    teamID
    name
    icon
    rootDocument {
      ...DocumentDecryptedMetadata
      ...DocumentBasicInfoWithoutTeamOrOrg
      ...DocumentPermissionProxies
    }
  }
  everyoneTeam {
    teamID
    rootDocument {
      ...DocumentDecryptedMetadata
      ...DocumentBasicInfoWithoutTeamOrOrg
      ...DocumentInvites
      ...DocumentCollaborators
    }
  }
  personalTeam {
    teamID
    rootDocument {
      docID
    }
  }
  displayPictureData {
    profileAccentColor
    profileCustomURI
    profileIcon
  }
  rootDocID
  hasCustomized
}

fragment Thread on UserThread {
  threadID
  attributes {
    read
    systemLabels
    userLabels {
      labelID
      color
      labelName
      variant
    }
  }
  emails {
    ...Email
  }
  emailsUpdatedAt
  sentLabelUpdatedAt
  deletedAt
  senderToSilence
  senderToSilenceMessageCounter
  senderToSilenceTotalBytes
  threadContentUpdatedAt
}

fragment ThreadWithoutContent on UserThread {
  threadID
  attributes {
    read
    systemLabels
    userLabels {
      labelID
      color
      labelName
      variant
    }
  }
  emails {
    ...EmailWithoutContent
  }
  emailsUpdatedAt
  sentLabelUpdatedAt
  deletedAt
}

fragment UserPreferencesData on UserPreferences {
  autoAdvance
  advanceToNext
  theme
  dateFormat
  hourFormat
  showPageIcon
  defaultCalendarColor
  defaultCalendarView
  defaultCalendarViewMobile
  startDayOfTheWeek
  leftSwipeGesture
  rightSwipeGesture
  blockRemoteContent
  securedBySkiffSigDisabled
  showAliasInboxes
  fileTableFormat
  threadFormat
  hideActivationChecklist
  tableOfContents
}

fragment UserProfileData on User {
  userID
  username
  publicData {
    displayName
    displayPictureData {
      profileAccentColor
      profileCustomURI
      profileIcon
    }
  }
}

fragment UserProfileDataWithKeys on User {
  ...UserProfileData
  publicKey
  signingPublicKey
}

fragment UserProfileOrgData on User {
  userID
  username
  publicData {
    displayName
    displayPictureData {
      profileAccentColor
      profileCustomURI
      profileIcon
    }
  }
  publicKey
  rootOrganization {
    orgID
    name
    displayPictureData {
      profileAccentColor
      profileCustomURI
      profileIcon
    }
  }
}

fragment UserWithEmailAliases on User {
  userID
