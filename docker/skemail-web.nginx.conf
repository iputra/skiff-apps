server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip_static on;
    # Behind NPM/Cloudflare: keep redirects relative to the public host.
    absolute_redirect off;

    location = / {
        return 302 /mail/inbox;
    }

    location /mail/ {
        try_files $uri /mail/index.html;
    }

    # Hashed bundles never change.
    location ~* ^/mail/skemail6-.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /mail/index.html {
        add_header Cache-Control "no-cache";
    }
}
